[package]
name = "oauth-to-key-mcp-proxy"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "A minimal OAuth facade for bearer-authenticated HTTP MCP servers"
license = "MIT"
repository = "https://github.com/FarisZR/oauth-to-key-mcp-proxy"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["cors"] }
url = { version = "2", features = ["serde"] }

[dev-dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
